name: Verify clean installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, mbstring, gd, zip, xml, fileinfo
          coverage: none
          tools: composer:v2
      - run: composer install --working-dir=Backend --no-interaction --prefer-dist
      - run: composer validate --working-dir=Backend --no-check-publish
      - name: Bootstrap an empty MySQL installation
        run: |
          if ! php tools/setup-local.php > "$RUNNER_TEMP/attendance-setup.log" 2>&1; then
            sed '/password:/Id' "$RUNNER_TEMP/attendance-setup.log"
            exit 1
          fi
      - name: Verify empty database, demo login and private configuration
        working-directory: Backend
        run: php vendor/bin/phpunit --filter='SetupDemoTest|PrivateConfigurationTest|AdminCreationPasswordTest'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze --no-fatal-infos
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
      - run: flutter build web --dart-define=API_BASE_URL=http://127.0.0.1:8000/api
        working-directory: frontend
